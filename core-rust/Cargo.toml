[package]
name        = "nexusquant-core"
version     = "0.1.0"
edition     = "2021"
authors     = ["Anas Lahraoui <anas@nexusquant.ai>", "Othman Karam <othman@nexusquant.ai>"]
description = "NexusQuant AI — Core execution engine: WebSocket tick ingestion, order routing, risk checks"

[[bin]]
name = "nexusquant-core"
path = "src/main.rs"

[lib]
name = "nexusquant_core"
path = "src/lib.rs"

[dependencies]
tokio             = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util      = "0.3"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url               = "2"
reqwest           = { version = "0.12", features = ["json"] }
tokio-postgres    = { version = "0.7", features = ["with-chrono-0_4"] }
chrono            = { version = "0.4", features = ["serde"] }
anyhow            = "1"
